name: Feature request
description: Propose a capability or change to the ADME rib.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The rib administers one ADME instance through three tabs. Every change it
        makes is a previewed plan first. Describe the admin task you are trying to
        do; we'll work out where it fits.

        This repo is public. Leave out instance hosts, partition names, tenant ids,
        people, emails and object ids; describe them by role instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What admin task is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ADME Access
        - ADME Data
        - ADME Seismic
        - Connection / first run
        - Plan preview or Apply
        - Docs
        - Not sure / other
    validations:
      required: true
